# Monta o Foca.AI para Windows e Linux e publica numa versão (Release) do GitHub.
# Dispara ao criar uma tag v* (ex.: git tag v1.0.1 && git push --tags).
name: Montar e publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm foca.spec
      - run: Rename-Item dist/Foca.AI.exe Foca.AI-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Foca.AI-Windows.exe

  linux:
    # 22.04 para o executável rodar também em distribuições um pouco mais antigas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (som e janela)
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libpulse0 xvfb libegl1 libnss3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libasound2 libgl1
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm foca.spec
      - name: Conferir que o executável funciona
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=teste
          ./dist/Foca.AI/Foca.AI --versao
          # abre a janela num monitor virtual; se ainda estiver aberta após 20 s, deu certo
          timeout 20 xvfb-run -a ./dist/Foca.AI/Foca.AI || [ $? -eq 124 ]
      - run: tar -czf Foca.AI-Linux.tar.gz -C dist Foca.AI
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Foca.AI-Linux.tar.gz

  publicar:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: Foca.AI ${{ github.ref_name }}
          files: |
            windows/Foca.AI-Windows.exe
            linux/Foca.AI-Linux.tar.gz
